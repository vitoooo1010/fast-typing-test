<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ڕاهێنانی تایپکردن و سپێڵینگ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">
    <header class="w-full max-w-4xl text-center py-6">
        <h1 class="text-3xl font-bold text-emerald-400 mb-2">ڕاهێنانی تایپکردن و سپێڵینگی ئینگلیزی</h1>
        <p class="text-slate-400 text-sm">بەخێر بێیت بۆ وێبساپتەکەت</p>
    </header>
    <main class="w-full max-w-4xl bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl flex flex-col gap-6">
        <div id="typing-box" class="bg-slate-900 p-6 rounded-xl border border-slate-700 min-h-[120px] flex items-center justify-center cursor-pointer">
            <div id="text-display" class="text-xl text-slate-300 tracking-wide leading-relaxed select-none">لێرە دەست بە ڕاهێنان بکە...</div>
        </div>
    </main>
    <footer class="text-slate-500 text-xs py-4">
        تایپکردنی خێرا - هەموو مافەکان پارێزراون
    </footer>
</body>
</html>
